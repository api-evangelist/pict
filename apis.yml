description: PICT was a San Francisco startup (founded 2012 by Brent Locks, Kele Dobrinski, and
  Gregory Nicholas) that built a platform to make images shoppable, letting publishers tag and
  monetize products within photos. It raised a $1.4M seed round in 2013 backed by 500 Global, Opus
  Capital, Lowercase Capital, and Forerunner Ventures, and was acquired by PopSugar in January 2014.
  The pict.com domain no longer resolves and the company exposes no public API surface.
